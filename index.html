<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AA Production Studio</title>
  <style>
    /* Global Reset & Base Theme */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #050709;
      color: #c5c6c7;
      line-height: 1.6;
    }

    /* Navigation Bar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0b0c10;
      padding: 15px 30px;
      border-bottom: 2px solid #66fcf1;
      position: relative;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #66fcf1;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 20px;
    }

    .nav-links a {
      color: #c5c6c7;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: #66fcf1;
    }

    /* Mobile Menu Toggle Button */
    .menu-toggle {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 5px;
    }

    .menu-toggle span {
      width: 25px;
      height: 3px;
      background-color: #66fcf1;
      border-radius: 2px;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(180deg, #0b0c10 0%, #050709 100%);
    }

    .hero h1 {
      font-size: 42px;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .hero p {
      color: #45a29e;
      font-size: 18px;
    }

    /* Feedback & Review Section */
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .review-card {
      background-color: #0b0c10;
      padding: 30px;
      border-radius: 10px;
      border: 1px solid #1f2833;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .review-card h2 {
      color: #66fcf1;
      margin-bottom: 20px;
      font-size: 22px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #c5c6c7;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      background-color: #1f2833;
      border: 1px solid #45a29e;
      color: #ffffff;
      border-radius: 5px;
      font-size: 14px;
    }

    .form-group textarea {
      resize: vertical;
      height: 100px;
    }

    /* Star Rating */
    .stars-container {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
      font-size: 24px;
      cursor: pointer;
    }

    .star {
      color: #45a29e;
      transition: color 0.2s;
    }

    .star.selected {
      color: #ff9900;
    }

    .btn-submit {
      background-color: #66fcf1;
      color: #050709;
      border: none;
      padding: 12px 25px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }

    .btn-submit:hover {
      background-color: #45a29e;
    }

    /* Live Reviews Feed */
    .reviews-list {
      margin-top: 30px;
    }

    .single-review {
      background-color: #1f2833;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 10px;
      border-left: 4px solid #66fcf1;
    }

    /* Responsive Mobile CSS */
    @media (max-width: 768px) {
      .menu-toggle {
        display: flex;
      }

      .nav-links {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
        background-color: #0b0c10;
        padding: 20px;
        border-bottom: 2px solid #66fcf1;
      }

      .nav-links.active {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="logo">AA Production</div>
    <div class="menu-toggle" id="mobileMenuBtn">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <ul class="nav-links" id="navLinks">
      <li><a href="#home">Home</a></li>
      <li><a href="#games">Games</a></li>
      <li><a href="#feedback">Feedback</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <section class="hero" id="home">
    <h1>AA Production Studio</h1>
    <p>Empowering Next-Gen Gaming</p>
  </section>

  <!-- Review / Feedback Form -->
  <div class="container" id="feedback">
    <div class="review-card">
      <h2>Leave Your Feedback</h2>
      
      <div class="form-group">
        <label>Your Name / Gamer Tag</label>
        <input type="text" id="userNameInput" placeholder="Enter your name..." />
      </div>

      <div class="form-group">
        <label>Rating</label>
        <div class="stars-container" id="starRating">
          <span class="star selected" data-value="1">★</span>
          <span class="star selected" data-value="2">★</span>
          <span class="star selected" data-value="3">★</span>
          <span class="star selected" data-value="4">★</span>
          <span class="star selected" data-value="5">★</span>
        </div>
      </div>

      <div class="form-group">
        <label>Message / Review</label>
        <textarea id="userReviewText" placeholder="Write your feedback here..."></textarea>
      </div>

      <button class="btn-submit" id="submitBtn">Submit Review</button>

      <!-- Submitted Reviews Display -->
      <div class="reviews-list" id="reviewsContainer"></div>
    </div>
  </div>

  <!-- JavaScript Code -->
  <script>
    // -------------------------------------------------------------
    // CONFIGURATION: Aapna Discord Webhook URL yahan Paste Karein
    // -------------------------------------------------------------
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1543538976294441012/E2chNliSSZDn1wuzlio74vJoc_1SzTnK_awdqOEbnIRwNUW8jaIsRAh_xDFilfES2A6i";


    // 1. Mobile Menu Toggle Logic
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const navLinks = document.getElementById('navLinks');

    mobileMenuBtn.addEventListener('click', function() {
      navLinks.classList.toggle('active');
    });

    // 2. Star Rating Selection Logic
    let currentRating = 5;
    const stars = document.querySelectorAll('.star');

    stars.forEach(star => {
      star.addEventListener('click', function() {
        currentRating = parseInt(this.getAttribute('data-value'));
        stars.forEach((s, index) => {
          if (index < currentRating) {
            s.classList.add('selected');
          } else {
            s.classList.remove('selected');
          }
        });
      });
    });

    // 3. Review Submission & Discord Integration
    const submitBtn = document.getElementById('submitBtn');

    submitBtn.addEventListener('click', async function() {
      const nameInput = document.getElementById('userNameInput');
      const textInput = document.getElementById('userReviewText');

      const name = nameInput.value.trim() || 'Anonymous Player';
      const text = textInput.value.trim();

      if (!text) {
        alert('Please write some feedback message before submitting!');
        return;
      }

      // UI Screen par Review Add Karein
      const reviewsContainer = document.getElementById('reviewsContainer');
      const newReview = document.createElement('div');
      newReview.className = 'single-review';

      let starStr = '★'.repeat(currentRating) + '☆'.repeat(5 - currentRating);
      newReview.innerHTML = `<strong>${name}:</strong> ${text} <div style="color:#ff9900; margin-top:4px;">${starStr}</div>`;
      reviewsContainer.prepend(newReview);

      // Discord Channel Par Send Karein
      if (DISCORD_WEBHOOK_URL.includes("discord.com/api/webhooks/")) {
        try {
          await fetch(DISCORD_WEBHOOK_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              username: "AA Studio Review Bot",
              embeds: [
                {
                  title: "⭐ New Game Review Received!",
                  color: 6749425, // Neon Cyan Hex
                  fields: [
                    { name: "👤 Player Name", value: name, inline: true },
                    { name: "⭐ Rating", value: `${currentRating} / 5 Stars`, inline: true },
                    { name: "💬 Feedback Message", value: text }
                  ],
                  footer: { text: "AA Production Studio Website" },
                  timestamp: new Date().toISOString()
                }
              ]
            })
          });
        } catch (error) {
          console.error("Discord send error:", error);
        }
      }

      // Input Reset Karein
      textInput.value = '';
      nameInput.value = '';
      alert('Thank you! Your review has been submitted.');
    });
  </script>
</body>
</html>
