<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AA Production Studio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #333;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0, 255, 204, 0.1);
    }
    h1 {
      color: #00ffcc;
      margin-bottom: 5px;
    }
    .badge {
      background: #ff9900;
      color: #000;
      padding: 4px 12px;
      font-weight: bold;
      border-radius: 15px;
      font-size: 0.8rem;
      display: inline-block;
      margin-bottom: 20px;
    }
    p {
      color: #ccc;
      font-size: 1rem;
    }
    .download-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background-color: #00ffcc;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      font-size: 1.1rem;
      transition: 0.2s;
    }
    .download-btn:hover {
      background-color: #00cc99;
      transform: scale(1.05);
    }
    footer {
      margin-top: 25px;
      font-size: 0.9rem;
      color: #777;
    }
    footer span {
      color: #00ffcc;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>AA Production Studio</h1>
    <div class="badge">⚠️ Website Under Development</div>
    
    <h2>🎮 Our Game</h2>
    <p>Download our latest Unity game directly and enjoy PC gaming!</p>

    <!-- Google Drive Ka Link " " Ke Andar Daalein -->
    <a href="https://drive.google.com/file/d/1-O27TnKqxG3m2ZmEtYWOTesRBk1x3sgH/view" target="_blank" class="download-btn">
      ⬇️ Download Game (PC)
    </a>

    <footer>
      Created By <span>Abhishek & Abeer</span>
    </footer>
  </div>

</body>
</html>
