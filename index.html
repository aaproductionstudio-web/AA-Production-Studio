<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AA Production Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background-color: #0b0c10;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Top Banner (YouTube Style) with Glow Animation */
    .banner-container {
      width: 100%;
      max-width: 800px;
      margin-top: 20px;
      padding: 0 15px;
    }
    .banner-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 204, 0.3);
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    .banner-img:hover {
      transform: scale(1.01);
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.5);
    }

    /* Main Content Card with Entrance Animation */
    .card {
      background: #1f2833;
      padding: 30px 25px;
      border-radius: 16px;
      border: 1px solid #45a29e;
      max-width: 800px;
      width: calc(100% - 30px);
      margin-top: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      animation: fadeIn 1s ease-in-out;
    }

    h1 {
      color: #66fcf1;
      font-size: 2rem;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(102, 252, 241, 0.3);
    }

    /* Animated Badge */
    .badge {
      background: #ff9900;
      color: #000;
      padding: 6px 14px;
      font-weight: bold;
      border-radius: 20px;
      font-size: 0.8rem;
      display: inline-block;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }

    p {
      color: #c5c6c7;
      font-size: 1rem;
      line-height: 1.6;
    }

    /* Glowing Download Button with Smooth Hover */
    .download-btn {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 28px;
      background-color: #66fcf1;
      color: #0b0c10;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      font-size: 1.1rem;
      box-shadow: 0 0 15px rgba(102, 252, 241, 0.4);
      transition: all 0.3s ease;
    }
    .download-btn:hover {
      background-color: #45a29e;
      color: #ffffff;
      transform: translateY(-4px);
      box-shadow: 0 0 25px rgba(102, 252, 241, 0.8);
    }

    footer {
      margin-top: 30px;
      font-size: 0.9rem;
      color: #666;
      border-top: 1px solid #2f3e46;
      padding-top: 15px;
    }
    footer span {
      color: #66fcf1;
      font-weight: bold;
    }

    /* Keyframe Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 153, 0, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(255, 153, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 153, 0, 0); }
    }

    /* Mobile Responsive View */
    @media (max-width: 480px) {
      .banner-img { height: 130px; }
      h1 { font-size: 1.5rem; }
      .download-btn { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Glowing Top Banner -->
  <div class="banner-container">
    <img src="banner.jpg" alt="AA Production Studio Banner" class="banner-img">
  </div>

  <!-- Content Card -->
  <div class="card">
    <h1>AA Production Studio</h1>
    <div class="badge">⚠️ Under Development</div>

    <p>We are creating awesome gaming experiences. Download our PC game below!</p>

    <!-- Google Drive Download Button -->
    <a href="https://drive.google.com/file/d/1-O27TnKqxG3m2ZmEtYWOTesRBk1x3sgH/view" target="_blank" class="download-btn">
      ⬇️ Spiderman Reloaded (PC)
    </a>

    <footer>
      Created By <span>Abhishek & Abeer</span>
    </footer>
  </div>

</body>
</html>
