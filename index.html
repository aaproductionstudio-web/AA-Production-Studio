<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AA Production Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 30px;
    }

    /* Top YouTube-Style Banner Container */
    .banner-container {
      width: 100%;
      max-width: 800px; /* Card se thoda chauda ya fit rakhne ke liye */
      margin-top: 20px;
      padding: 0 15px;
    }
    .banner-img {
      width: 100%;
      height: 180px; /* PC par height */
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #333;
      box-shadow: 0 4px 15px rgba(0, 255, 204, 0.2);
    }

    /* Main Content Card */
    .card {
      background: #1e1e1e;
      padding: 25px 20px;
      border-radius: 16px;
      border: 1px solid #333;
      max-width: 800px;
      width: calc(100% - 30px);
      margin-top: 15px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    h1 {
      color: #00ffcc;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .badge {
      background: #ff9900;
      color: #000;
      padding: 5px 12px;
      font-weight: bold;
      border-radius: 20px;
      font-size: 0.75rem;
      display: inline-block;
      margin-bottom: 15px;
    }

    p {
      color: #ccc;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .download-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #00ffcc;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    .download-btn:hover {
      background-color: #00cc99;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 25px;
      font-size: 0.85rem;
      color: #777;
      border-top: 1px solid #2a2a2a;
      padding-top: 15px;
    }
    footer span {
      color: #00ffcc;
      font-weight: bold;
    }

    /* Mobile view ke liye auto-height adjustment */
    @media (max-width: 480px) {
      .banner-img {
        height: 120px; /* Mobile par banner ki height thodi kam ho jayegi */
      }
      h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Banner (YouTube Style) -->
  <div class="banner-container">
    <img src="banner.jpg" alt="AA Production Studio Banner" class="banner-img">
  </div>

  <!-- Content Card -->
  <div class="card">
    <h1>AA Production Studio</h1>
    <div class="badge">⚠️ Under Development</div>

    <p>We are creating awesome gaming experiences. Download our PC game below!</p>

    <!-- Google Drive Download Link -->
    <a href="https://drive.google.com/file/d/1-O27TnKqxG3m2ZmEtYWOTesRBk1x3sgH/view" target="_blank" class="download-btn">
      ⬇️ Spiderman Reloaded (PC)
    </a>

    <footer>
      Created By <span>Abhishek & Abeer</span>
    </footer>
  </div>

</body>
</html>
