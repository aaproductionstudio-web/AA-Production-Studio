<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AA Production Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .card {
      background: #1e1e1e;
      padding: 30px 20px;
      border-radius: 16px;
      border: 1px solid #333;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 255, 204, 0.15);
    }
    
    /* Header layout - Logo aur Title side-by-side */
    .header-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .logo {
      width: 50px;
      height: 50px;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(0, 255, 204, 0.4));
    }
    h1 {
      color: #00ffcc;
      font-size: 1.6rem;
      line-height: 1.2;
    }

    .badge {
      background: #ff9900;
      color: #000;
      padding: 5px 12px;
      font-weight: bold;
      border-radius: 20px;
      font-size: 0.75rem;
      display: inline-block;
      margin-bottom: 20px;
    }
    p {
      color: #ccc;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .download-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #00ffcc;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.2s ease;
      width: 80%;
    }
    .download-btn:hover {
      background-color: #00cc99;
      transform: translateY(-2px);
    }
    footer {
      margin-top: 25px;
      font-size: 0.85rem;
      color: #777;
      border-top: 1px solid #2a2a2a;
      padding-top: 15px;
    }
    footer span {
      color: #00ffcc;
      font-weight: bold;
    }

    /* Mobile screens ke liye auto adjust */
    @media (max-width: 480px) {
      .card {
        padding: 20px 15px;
      }
      .logo {
        width: 40px;
        height: 40px;
      }
      h1 {
        font-size: 1.3rem;
      }
      .download-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-container">
      <img src="logo.png" alt="AA Logo" class="logo">
      <h1>AA Production Studio</h1>
    </div>

    <div class="badge">⚠️ Under Development</div>

    <p>We are creating awesome gaming experiences. Download our PC game below!</p>

    <!-- Apne Google Drive ka shared link niche paste karein -->
    <a href="https://drive.google.com/file/d/1-O27TnKqxG3m2ZmEtYWOTesRBk1x3sgH/view" target="_blank" class="download-btn">
      ⬇️ Spiderman Reloaded (PC)
    </a>

    <footer>
      Created By <span>Abhishek & Abeer</span>
    </footer>
  </div>

</body>
</html>
